<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YTLA Fund</title>
</head>
<body>

<div>快速查询基金名称</div>
<form action="/fundInfo" method="GET">
    基金代码 <label>
    <input name="code" type="text">
</label><br>
    查询—>
    <input name="查询" type="submit"><br>
</form>
<br><br><br>


<div>下方快速输入交易信息</div>
<div>交易类型 </div>
<div>预约买入-01 预约卖出-11 </div>
<div>买入-08 卖出-18 份额变动-28 分红份额-38 分红现金-48</div>

<form action="/transactionLogOn" method="POST">
    基金代码 <label>
    <input name="code" type="text">
</label><br>
    交易日期 <label>
    <input name="transactionDate" type="text">
</label><br>
    交易类型 <label>
    <input name="transactionType" type="text">
</label><br>
    交易金额 <label>
    <input name="amount" type="text">
</label><br>
    交易份额 <label>
    <input name="share" type="text">
</label><br>
    交易单价 <label>
    <input name="price" type="text">
</label><br>
    手续费 <label>
    <input name="transactionFee" type="text">
</label><br>
    登录这笔交易—>
    <input name="登录" type="submit"><br>
</form>
<br><br><br>

<div>执行自动化清算</div>
<form action="/auto" method="GET">
    <br>
    执行过程中请不要点击其它页面按钮，暂时没有做相关控制<br>
    点此执行—>
    <input name="执行" type="submit"><br>
</form>
<br><br><br>

</body>
</html>
